<style>
/* Layout: full-bleed 3D arena; HUD pinned to the edges; menu and result cards float over the live scene */
:root{--bg:#0b0c0f;--panel:rgba(30,34,42,.32);--glass-line:rgba(255,255,255,.16);--chip:rgba(255,255,255,.06);--line:#2c3139;--fg:#f2f4ef;--muted:#a3aaa6;--lime:#c8f031;--lime-ink:#151b04;--red:#ff4f4a;--amber:#ffb22e;--zone:#78cf38;--display:'Pretendard',-apple-system,'Apple SD Gothic Neo',system-ui,sans-serif;--body:'Pretendard',-apple-system,'Apple SD Gothic Neo',system-ui,sans-serif;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#stage{position:relative;height:100%;touch-action:none;-webkit-tap-highlight-color:transparent;overflow:hidden}
#cv{display:block;width:100%;height:100%}
.hud{position:absolute;inset:0;z-index:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding-top:max(18px,calc(env(safe-area-inset-top,0px) + 10px));padding-bottom:max(44px,calc(24px + env(safe-area-inset-bottom,0px)));padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px))}
.hud::before,.hud::after{content:"";position:absolute;left:0;right:0;z-index:-1;pointer-events:none}
.hud::before{top:0;height:170px;background:linear-gradient(rgba(5,6,8,.78),rgba(5,6,8,.35) 55%,rgba(5,6,8,0))}
.hud::after{bottom:0;height:150px;background:linear-gradient(rgba(5,6,8,0),rgba(5,6,8,.72))}
.phase{font:700 11px/1 var(--display);letter-spacing:.16em;text-align:center;margin-top:6px;color:var(--muted);text-shadow:0 1px 6px rgba(0,0,0,.7);white-space:nowrap}
#pban{position:absolute;left:0;right:0;top:19%;text-align:center;font:900 clamp(22px,5vw,34px)/1 var(--display);letter-spacing:.14em;opacity:0;pointer-events:none;text-shadow:0 3px 16px rgba(0,0,0,.7)}
#pban.go{animation:pop 1.7s ease-out forwards}
#fin{position:absolute;left:0;right:0;top:22%;text-align:center;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:6px;text-shadow:0 4px 24px rgba(0,0,0,.6)}
#fin b{font:italic 900 clamp(48px,14vw,104px)/.95 'WB Title','Pretendard',sans-serif;color:var(--fg);white-space:nowrap}
#fin b em{color:var(--lime);font-style:inherit}
#fin span{font:800 clamp(12px,3.2vw,18px)/1 var(--display);letter-spacing:.22em;color:var(--fg)}
#fin.go{animation:finIn .9s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes finIn{0%{opacity:0;transform:scale(.7) translateY(12px)}100%{opacity:1;transform:none}}
#patch.pop{animation:patchIn .8s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes patchIn{0%{opacity:0;transform:scale(.4) rotate(-12deg);filter:drop-shadow(0 0 0 rgba(200,240,49,0))}60%{filter:drop-shadow(0 0 22px rgba(200,240,49,.7))}100%{opacity:1;transform:none;filter:drop-shadow(0 0 10px rgba(200,240,49,.35))}}
#op{background:rgba(6,7,9,.62)}
#of{background:rgba(6,7,9,.1)}
@media (min-width:900px){#of{justify-items:end;padding-right:max(7vw,24px)}}
@media (max-width:899px){#of{align-items:start;padding-top:max(72px,calc(env(safe-area-inset-top,0px) + 56px))}}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:8px}
.lab{font:700 11px/1 var(--display);letter-spacing:.14em;color:var(--muted)}
.val{font:800 28px/1.05 var(--display);font-variant-numeric:tabular-nums;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.div{font:700 12px/1 var(--display);letter-spacing:.12em;color:var(--lime);margin-top:6px}
.count{font:800 clamp(42px,9vw,68px)/.95 var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums;text-align:center;text-shadow:0 2px 14px rgba(0,0,0,.65)}
.count b{color:var(--lime);font-weight:800}
.count small{font-size:.5em}
.r{text-align:right}
.tools{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
.ib{pointer-events:auto;width:40px;height:40px;border-radius:12px;border:1px solid var(--glass-line);background:rgba(22,26,32,.4);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:var(--fg);cursor:pointer;display:grid;place-items:center;padding:0}
.ib svg{width:18px;height:18px}
.ib[aria-pressed="false"] .on,.ib[aria-pressed="true"] .off{display:none}
.bottom{display:flex;flex-direction:column;align-items:center;gap:8px}
.hint{font-size:12px;line-height:1.3;font-weight:500;white-space:nowrap;padding:4px 11px!important;background:rgba(22,26,32,.45);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--glass-line);padding:6px 12px;border-radius:999px;text-align:center}
.hint.rest{color:var(--amber);font-weight:800;border-color:rgba(255,178,46,.45)}
.hint.off{visibility:hidden}
.gauge{position:relative;width:min(520px,88%);height:18px;border:1.5px solid #e8ebe6;border-radius:10px;overflow:hidden;background:rgba(0,0,0,.5)}
.gauge i{position:absolute;top:0;bottom:0;display:block}

  if(resting){const tx='휴식 '+Math.ceil(6-idle)+'초';if(hn.textContent!==tx)hn.textContent=tx;hn.classList.add('rest')}else{if(hn.textContent!=='꾹 눌러 앉고 · 초록에서 놓기')hn.textContent='꾹 눌러 앉고 · 초록에서 놓기';hn.classList.remove('rest')}
  hn.classList.toggle('off',!(resting||guide))}}
 // camera
 camT+=dt;const CP=camPose();const PT=CP.th;
 if(camMode==='menu')camTh=RM?.9:.95+.45*Math.sin(t*.22);
 else if(camMode==='intro'){const k=RM?1:Math.min(1,camT/1.8);camTh=introFrom+(PT-introFrom)*e(k);if(k>=1)camMode='play'}
 else if(camMode==='cele')camTh=RM?PT:PT+(portrait()?.16:.5)*Math.sin(celeT*.45);
 else camTh+=(PT-camTh)*Math.min(1,dt*3);
  const Rr=CP.r*(camMode==='cele'?.88:1)*(camMode==='menu'?1.08:1);const Cc=CP.c;
 let px=Cc.x+Math.sin(camTh)*Rr,py=CP.y,pz=Cc.z+Math.cos(camTh)*Rr;
 if(shake>0){if(!RM){px+=(Math.random()-.5)*shake;py+=(Math.random()-.5)*shake}shake=Math.max(0,shake-dt*.7)}
 cam.position.set(px,py,pz);cam.lookAt(Cc)}
if(document.fonts&&document.fonts.load)Promise.all(['900 40px Pretendard','800 40px Pretendard','800 40px Pretendard'].map(f=>document.fonts.load(f))).then(()=>{[wallT,banT,barT,barT2,tzT,igT].forEach(t=>t.redraw())}).catch(()=>{});
requestAnimationFrame(frame);
}
(function(){
 const $=id=>document.getElementById(id);
 function failUI(kind){const b=$('bstart');b.disabled=true;b.textContent='START';$('bload').hidden=false;
  $('om').querySelector('.sub').textContent=kind==='webgl'?'이 브라우저는 3D(WebGL)를 지원하지 않아요':'3D 엔진을 불러오지 못했어요';
  $('mbest').textContent=kind==='webgl'?'다른 브라우저나 기기에서 열어 주세요':'인터넷 연결을 확인하고 다시 시도해 주세요'}
 $('bload').onclick=()=>location.reload();
 const glOK=()=>{try{const c=document.createElement('canvas');return !!(window.WebGLRenderingContext&&(c.getContext('webgl')||c.getContext('experimental-webgl')))}catch(e){return false}};
 function go(){if(!glOK()){failUI('webgl');return}try{WB_BOOT()}catch(e){console.error(e);failUI('webgl')}}
 if(window.THREE)go();
 else{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js';sc.onload=()=>window.THREE?go():failUI('load');sc.onerror=()=>failUI('load');document.head.appendChild(sc)}
})();
